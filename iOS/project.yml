name: MealTrace
options:
  bundleIdPrefix: dev.mealtrace
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.1'
    CURRENT_PROJECT_VERSION: '2'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
targets:
  MealTrace:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: TestFixtures
        buildPhase: resources
      - path: Resources
        excludes: [Licenses]
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mealtrace.ios
        SWIFT_OBJC_BRIDGING_HEADER: Native/MealVision.h
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Native'
        OTHER_LDFLAGS: '$(inherited) -lc++ -framework Metal -framework MetalKit -framework Accelerate -framework Foundation $(SRCROOT)/build/$(PLATFORM_NAME)/libmealvision-combined.a'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: food.jpg
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 食迹
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: 食迹在本机检查你授权的新照片，发现可能的餐食，并在你确认后清理选中的旧食物照片。照片不会上传。
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [dev.mealtrace.ios.scan]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    preBuildScripts:
      - name: Build pinned local vision library
        script: 'python3 "$SRCROOT/tools/build_native.py"'
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: Photos.framework
      - sdk: Vision.framework
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: Metal.framework
      - sdk: Accelerate.framework
schemes:
  MealTrace:
    build:
      targets:
        MealTrace: all
    run:
      config: Debug
