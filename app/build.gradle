plugins { id 'com.android.application' }
android {
    namespace 'dev.mealtrace.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'dev.mealtrace.app'
        minSdk 30
        targetSdk 36
        versionCode 5
        versionName '0.1.3'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'dev.mealtrace.app.AccelerationVerification'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    testBuildType 'release'
    sourceSets { androidTest.assets.srcDirs += ['../iOS/TestFixtures'] }
}
dependencies {
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
